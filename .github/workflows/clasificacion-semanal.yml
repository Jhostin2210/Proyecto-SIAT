# Clasificación semanal automática del riesgo de los estudiantes (requisito REQ-04, paquete 1.3.2 de la EDT).
# Corre cada lunes antes del inicio de clases y también a pedido. La API, además, revisa cada hora si ya
# pasaron 7 días desde la última clasificación de su base.
name: Clasificación semanal del riesgo

on:
  schedule:
    - cron: "0 11 * * 1" # lunes, 06:00 de Lima
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clasificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Sin estos secretos se clasifica una base temporal con los datos de práctica del repositorio.
      # Al configurar la base gestionada (DB_HOST y los demás), se clasifica la base real.
      USE_SQLITE_FALLBACK: ${{ secrets.DB_HOST == '' && 'true' || 'false' }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Cargar los datos de práctica en la base temporal
        if: env.USE_SQLITE_FALLBACK == 'true'
        run: python -m etl.cargar_notas data/notas_practica.csv
      - name: Clasificar a los estudiantes
        run: python -m ml.clasificar_semanal --forzar | tee clasificacion.txt
      - name: Publicar el resultado en el resumen
        if: always()
        run: if [ -f clasificacion.txt ]; then { echo "### Clasificación semanal"; cat clasificacion.txt; } >> "$GITHUB_STEP_SUMMARY"; fi

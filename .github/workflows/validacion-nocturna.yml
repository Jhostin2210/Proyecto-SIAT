# Limpieza y validación automática de los datos (requisito REQ-02, paquete 1.2.2 de la EDT).
# Se ejecuta cada noche, fuera del horario escolar, y también en cada cambio y a pedido.
# Si una regla crítica falla, la ejecución queda en rojo y GitHub avisa por correo.
name: Validación nocturna de datos

on:
  schedule:
    - cron: "0 7 * * *" # 02:00 de Lima
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Sin estos secretos se valida una base temporal con los datos de práctica del repositorio.
      # Al configurar la base gestionada (DB_HOST y los demás), se valida la base real.
      USE_SQLITE_FALLBACK: ${{ secrets.DB_HOST == '' && 'true' || 'false' }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Cargar los datos de práctica en la base temporal
        if: env.USE_SQLITE_FALLBACK == 'true'
        run: python -m etl.cargar_notas data/notas_practica.csv
      - name: Validar los datos
        run: python -m etl.validar_datos --reporte reporte-calidad.md
      - name: Publicar el reporte en el resumen
        if: always()
        run: if [ -f reporte-calidad.md ]; then cat reporte-calidad.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-calidad
          path: backend/reporte-calidad.md
          if-no-files-found: ignore
